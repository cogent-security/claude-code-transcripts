{% extends "base.html" %}
{% block content %}
        <section class="conversation-heading">
            <div><h1>Session transcript</h1><p>Prompts, reasoning and tool execution.</p></div>
            <span class="conversation-count"><span>{{ message_count }}</span> messages</span>
        </section>
        <main class="conversation-log" aria-label="Full conversation">{{ messages_html|safe }}</main>
        {% if not message_count %}<p>No messages in this session.</p>{% endif %}
{% endblock %}
