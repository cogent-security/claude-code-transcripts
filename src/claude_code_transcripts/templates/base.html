<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Claude Code transcript{% endblock %}</title>
    <style>{{ css|safe }}</style>
    <style>{% include "cogent.css" %}</style>
</head>
<body>
    <div class="container">
        <header class="cogent-masthead">
            <span class="cogent-wordmark" role="img" aria-label="Cogent">{% include "cogent-wordmark.svg" %}</span>
            <span class="cogent-product">Agent workspace <span>/</span> Session archive</span>
            <span class="cogent-local">Local transcript</span>
        </header>
{%- block content %}{% endblock %}
        <footer class="cogent-footer"><span>End of transcript</span><span>Cogent · Agent workspace</span></footer>
    </div>
    <script>{{ js|safe }}</script>
    {% include "message_controls.html" %}
</body>
</html>
